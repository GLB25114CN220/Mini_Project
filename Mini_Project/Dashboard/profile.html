<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student Profile | GL Bajaj Dress Management</title><link rel="stylesheet" href="requests.css"><link rel="stylesheet" href="pages.css"></head><body><div class="app-shell"><aside class="sidebar"><div class="brand"><div class="brand-mark">GL</div><div><div class="brand-name">GL Bajaj ITM</div><div class="brand-sub">DRESS MANAGEMENT</div></div></div><ul class="side-nav" data-nav="profile"></ul><div class="admin-portal"><div class="admin-avatar">ST</div><div><div>Student Portal</div><div class="admin-email"></div></div></div></aside><main class="main"><div class="top-bar"><span>GL BAJAJ INSTITUTE OF TECHNOLOGY AND MANAGEMENT</span><span>Academic Year: 2025–26<span class="year-dot"></span></span></div><h1 class="page-title">Student Profile</h1><p class="page-subtitle">Your academic information is linked to your registered admission ID.</p><section class="panel"><div id="profile-content">Loading profile…</div></section></main></div><script>window.GLB_ACCESS='student';</script><script src="js/api.js"></script><script>(async()=>{const {api,esc,toast,user}=GLB;const el=document.querySelector('#profile-content');try{const s=await api('/student/profile');if(!s){el.innerHTML='<p>Your admission ID is not linked to a student record yet. Please contact the Dress Management office.</p>';return}el.innerHTML=`<div class="fields">${[['Full name',s.name],['Roll number',s.roll_no],['Branch',s.branch+(s.branch_code?' ('+s.branch_code+')':'')],['Section',s.section||'—'],['Academic year',s.year],['Email',s.email||'Not provided'],['Phone',s.phone||'Not provided'],['Admission ID',user.admission_id||'']].map(([k,v])=>`<div><label>${esc(k)}</label><div style="padding:12px;background:#f4f6fa;border-radius:8px">${esc(v)}</div></div>`).join('')}</div><p class="muted" style="margin-top:20px">To correct your official student details, contact the Dress Management office.</p>`}catch(e){el.textContent=e.message;toast(e.message,'error')}})();</script></body></html>
